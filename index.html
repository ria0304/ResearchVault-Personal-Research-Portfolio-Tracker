<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Portfolio</title>
<style>
:root{--bg1:#1b1036;--bg2:#3a1b6b;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);--tx:#f3eefc;--mu:#bfb4d9;--ac:#4f7cf3;--in:rgba(10,5,30,.4);--ok:#4ade80;--wn:#fbbf24;--bd:#f87171;--inf:#93a8ff;--sb:rgba(12,6,32,.5)}
[data-theme=light]{--bg1:#f4f0fc;--bg2:#e4d9f8;--card:#fff;--line:#d6cbef;--tx:#241743;--mu:#5f5580;--ac:#3f66e0;--in:#f7f4fd;--ok:#15803d;--wn:#a16207;--bd:#b91c1c;--inf:#3f4fc9;--sb:rgba(255,255,255,.75)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 12px}
.mu,small{color:var(--mu)}small{font-size:12.5px}
.app{display:grid;grid-template-columns:250px 1fr}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;padding:18px 14px;background:var(--sb);border-right:1px solid var(--line);backdrop-filter:blur(12px);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 16px}.brand b{display:block;line-height:1.2}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;color:#fff}
aside .sec{font-size:12.5px;color:var(--mu);padding:14px 12px 4px}
nav a,.nb{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:var(--mu);text-decoration:none;border:1px solid transparent;background:none;font:inherit;cursor:pointer;width:100%;text-align:left}
nav a:hover,.nb:hover{color:var(--tx);background:var(--card)}
nav a.on{color:var(--tx);background:rgba(99,102,241,.28);border-color:rgba(129,140,248,.55)}
.foot{margin-top:auto;padding:10px 12px 0;border-top:1px solid var(--line)}
main{padding:22px 28px 60px;min-width:0;max-width:1280px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.sr{flex:1;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mu)}
.sr input{border:0;background:none;outline:0;color:var(--tx);font:inherit;width:100%;padding:11px 0}
.menu{display:none}
button{font:inherit}
.btn,.btn2,.ic{cursor:pointer;border-radius:9px;border:1px solid var(--line);color:var(--tx);background:var(--card);padding:8px 14px;display:inline-flex;gap:8px;align-items:center}
.btn{background:var(--ac);border-color:transparent;color:#fff}.btn:hover{filter:brightness(1.1)}
.btn2:hover,.ic:hover{background:var(--in)}.ic{padding:7px 9px}
:focus-visible{outline:2px solid var(--inf);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:26px 28px;margin-bottom:18px}
.hero h1{font-size:28px}.hero p{margin:6px 0 0;color:var(--mu)}
.hero .logo{width:60px;height:60px;border-radius:14px}.hero .logo svg{width:28px;height:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{display:block;text-decoration:none;color:inherit;margin:0}.stat:hover{border-color:var(--inf)}
.si{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.stat b{font-size:26px;display:block;line-height:1.1}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;background:var(--in);border:1px solid transparent;border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
button.row:hover{border-color:var(--line)}
.row span:first-child{min-width:0}.row b{display:block;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block;margin-left:8px}
.bg{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12.5px;white-space:nowrap;color:var(--inf);background:color-mix(in srgb,var(--inf) 16%,transparent);border:1px solid color-mix(in srgb,var(--inf) 35%,transparent)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.bd{color:var(--bd)}
.bg.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.bg.wn{background:color-mix(in srgb,var(--wn) 16%,transparent);border-color:color-mix(in srgb,var(--wn) 35%,transparent)}
.bg.bd{background:color-mix(in srgb,var(--bd) 16%,transparent);border-color:color-mix(in srgb,var(--bd) 35%,transparent)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{resize:vertical;min-height:84px}.bar select{width:auto}
.rh{display:flex;align-items:center;gap:12px}.rh>div:first-child{flex:1;min-width:0}
.tt{background:none;border:1px solid transparent;font-weight:650;font-size:16px;padding:3px 6px;margin-left:-6px}
.tt:hover,.tt:focus{border-color:var(--line);background:var(--in)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
label span,.lb{display:block;font-size:12.5px;color:var(--mu);margin-bottom:3px}
.w{grid-column:1/-1}.lk{font-size:13px;color:var(--inf)}
.pr{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.ci{display:flex;gap:8px;align-items:center;margin-bottom:6px}.ci input[type=checkbox]{width:18px;height:18px;padding:0;flex:none;accent-color:var(--ac)}.ci .ct{flex:1}.ci.dn .ct{text-decoration:line-through;color:var(--mu)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hist{font-size:13px;color:var(--mu);margin:0;padding-left:18px}
pre{white-space:pre-wrap;font:inherit;margin:4px 0 0;color:var(--mu)}
#warn{display:none;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--bd) 18%,transparent);margin-bottom:14px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pr{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.app{grid-template-columns:1fr}main{padding:16px}aside{position:fixed;left:0;top:0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s;background:var(--bg1)}.nav-open aside{transform:none}.menu{display:inline-flex}.hero .logo{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand"><div class="logo" id="logo"></div><div><b>Research Portfolio</b><small>Personal tracker</small></div></div>
 <nav id="nav"></nav>
 <div class="sec">Data backup</div>
 <button class="nb" data-act="export"></button>
 <button class="nb" data-act="import"></button>
 <button class="nb" data-act="notes"></button>
 <button class="nb" data-act="theme"></button>

 <div class="foot"><small id="stamp"></small></div>
</aside>
<main>
 <div class="top"><button class="ic menu" data-act="menu" aria-label="Open menu" id="mb"></button>

</main>
</div>

const safeUrl=u=>/^https?:\/\//i.test(u);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.records)return fix(x)}catch(_){}return fix(structuredClone(SEED))}
const toItems=v=>String(v).split(/\n+/).map(q=>q.trim()).filter(Boolean).map(q=>({t:q,d:false}));
function fix(x){x.sn=x.sn||{};x.act=x.act||[];x.prefs=x.prefs||{name:'Ria',theme:'dark'};for(const t in SCHEMA){x.records[t]=x.records[t]||[];x.records[t].forEach(r=>{if(r.notes){r.todo=(r.todo||[]).concat(toItems(r.notes));delete r.notes}});if(typeof x.sn[t]==='string')x.sn[t]=toItems(x.sn[t])}
 if(!x.p2){x.p2=1;let n=0;for(const id in CPATCH){const r=x.records.conferences.find(q=>q.id===id);if(r){Object.assign(r,CPATCH[id]);r.u=now();n++}}if(n&&x.act.length)x.act.unshift({d:now(),t:'Conference details updated: IDs, websites, deadlines and dates'})}
 if(!x.p3){x.p3=1;x.records.projects=x.records.projects.filter(r=>r.id!=='p-fw');x.records.conferences=x.records.conferences.filter(r=>r.id!=='c-fw')}
 return x}
const fmtL=L=>L.map(x=>(x.d?'[x] ':'[ ] ')+x.t).join('\n');
const chk=(L,id)=>{const n=L.filter(x=>x.d).length;return `<div class="w"><span class="lb">Checklist${L.length?` (${n} of ${L.length} done)`:''}</span>${L.map((x,i)=>`<div class="ci${x.d?' dn':''}"><input type="checkbox" data-ci="${i}"${x.d?' checked':''} aria-label="Done"><input class="ct" data-ct="${i}" value="${e(x.t)}" aria-label="Checklist item"><button class="ic" data-act="cdel" data-i="${i}" aria-label="Remove item">×</button></div>`).join('')}<div class="ci"><input id="cn-${id}" data-cn placeholder="Add an item, then press Enter" aria-label="New checklist item"><button class="btn2" data-act="cadd">${ic('plus')} Add</button></div></div>`};
const lst=el=>{const rc=el.closest('.rec');if(rc){const r=find(rc.dataset.t,rc.dataset.id);return r.todo=r.todo||[]}const sc=el.closest('[data-sec]');return sc?(D.sn[sc.dataset.sec]=D.sn[sc.dataset.sec]||[]):[]};
const touch=el=>{const rc=el.closest('.rec');if(rc)find(rc.dataset.t,rc.dataset.id).u=now()};
function addItem(inp){const v=inp.value.trim();if(!v)return;lst(inp).push({t:v,d:false});touch(inp);const id=inp.id;save();keep();const n=document.getElementById(id);if(n)n.focus()}
function save(){D.saved=now();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(_){storeOK=false;$('#warn').style.display='block'}stamp()}
const saveSoon=()=>{clearTimeout(tm);tm=setTimeout(save,300)};
function stamp(){$('#stamp').textContent=D.saved?'Last saved '+new Date(D.saved).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Not saved yet'}
function act(t,id){D.act.unshift({d:now(),t,id});D.act.length=Math.min(D.act.length,300)}
function deadlines(){const L=[];
 A('conferences').forEach(r=>[['subDl','Submission deadline'],['regDl','Registration deadline'],['start','Conference starts']].forEach(([k,l])=>r[k]&&L.push({d:r[k],t:`${l}: ${r.venue||r.title}`,id:r.id,ty:'conferences'})));
 A('journals').forEach(r=>r.target&&L.push({d:r.target,t:`Target date: ${r.title}`,id:r.id,ty:'journals'}));
 return L.sort((a,b)=>a.d.localeCompare(b.d))}

/* ---------- views ---------- */
const head=(h,x='')=>`<header class="ph"><h1>${h}</h1>${x}</header>`;
const row=(t,r)=>`<button class="row" data-act="go" data-t="${t}" data-id="${r.id}"><span><b>${e(r.title)}</b><small>${SCHEMA[t].one}${r.archived?', archived':''}</small></span>${badge(r[SCHEMA[t].st])}</button>`;
function dash(){
 const P=A('projects'),C=A('conferences'),J=A('journals'),T=A('patents'),B=A('books');
 const acc=C.filter(r=>/^(Accepted|Camera-ready sent|Registered|Presented|Published)$/.test(r.status)).length;
 const wait=C.filter(r=>r.status==='Awaiting decision').length;
 const jp=J.filter(r=>!/^(Published|Rejected)$/.test(r.status)).length;
 const ts=T.filter(r=>!/^(|Idea \/ concept|Draft in preparation|IDF pending|IDF completed|Awaiting faculty signature|Ready for submission|Abandoned \/ withdrawn)$/.test(r.status)).length;
 const bs=B.filter(r=>!/^(|Idea|Proposal in preparation)$/.test(r.status)).length;
 const dl=deadlines().filter(x=>days(x.d)>=0),soon=dl.filter(x=>days(x.d)<=30).length;
 const S=[['projects','flask','#3b82f6',P.length,'Research projects',''],['conferences','file','#d946ef',C.length,'Conference papers',''],['conferences','check','#22c55e',acc,'Accepted papers',''],['conferences','clock','#f97316',wait,'Awaiting decision',''],['journals','pen','#6366f1',jp,'Journals in progress',''],['patents','shield','#14b8a6',ts,'Patents submitted',`${T.length} tracked`],['books','book','#ec4899',bs,'Book proposals submitted',''],['timeline','cal','#eab308',soon,'Deadlines in 30 days','']];
 const td=[];for(const t in SCHEMA)A(t).forEach(r=>(r.todo||[]).forEach(x=>!x.d&&td.push([t,r,x])));
 const rec=[];for(const t in SCHEMA)A(t).forEach(r=>r.u&&rec.push([t,r]));rec.sort((a,b)=>b[1].u.localeCompare(a[1].u));
 return `<section class="card hero"><div><h1>Welcome back, ${e(D.prefs.name)}</h1><p>${soon} deadline${soon===1?'':'s'} in the next 30 days. ${wait} paper${wait===1?'':'s'} awaiting a decision.</p></div><div class="logo">${ic('award')}</div></section>
 <div class="stats">${S.map(s=>`<a class="card stat" href="#${s[0]}"><div class="si" style="background:${s[2]}">${ic(s[1])}</div><b>${s[3]}</b>${s[4]}${s[5]?`<br><small>${s[5]}</small>`:''}</a>`).join('')}</div>
 <div class="two"><div>
  <section class="card"><h2>Open checklist items (${td.length})</h2>${td.slice(0,8).map(([t,r,x])=>`<button class="row" data-act="go" data-t="${t}" data-id="${r.id}"><span><b>${e(x.t)}</b><small>${e(r.title)}, ${SCHEMA[t].one}</small></span></button>`).join('')||'<p class="mu">Nothing open.</p>'}</section>
  <section class="card"><h2>Recent activity</h2>${D.act.slice(0,8).map(a=>`<div class="row"><span>${e(a.t)}</span><small>${fmt(a.d)}</small></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</section>
  <section class="card"><h2>Recently updated</h2>${rec.slice(0,5).map(([t,r])=>row(t,r)).join('')||'<p class="mu">Records you edit appear here.</p>'}</section></div>
 <div><section class="card"><h2>Upcoming deadlines</h2>${dl.slice(0,8).map(x=>{const n=days(x.d);return `<button class="row" data-act="go" data-t="${x.ty}" data-id="${x.id}"><span><b>${e(x.t)}</b><small>${fmt(x.d)}</small></span><span class="${n<=7?'bd':n<=21?'wn':'ok'}"><small>${n===0?'Today':n===1?'Tomorrow':'in '+n+' days'}</small><i class="dot"></i></span></button>`}).join('')||'<p class="mu">Add dates to conferences and journals to see them here.</p>'}</section>
  <section class="card"><h2>Quick actions</h2><div class="acts"><button class="btn" data-act="add" data-t="conferences">${ic('plus')} Conference paper</button><button class="btn" data-act="add" data-t="patents">${ic('plus')} Patent</button><button class="btn2" data-act="export">${ic('down')} Export backup</button></div></section></div></div>`}
function ctl([k,l,ty,o],r){const v=r[k]||'';let c;
 if(ty==='sel')c=`<select data-f="${k}"><option value="">—</option>${o.map(x=>`<option${x===v?' selected':''}>${e(x)}</option>`).join('')}</select>`;
 else if(ty==='proj')c=`<select data-f="${k}"><option value="">—</option>${D.records.projects.map(p=>`<option value="${p.id}"${p.id===v?' selected':''}>${e(p.title)}</option>`).join('')}</select>`;
 else if(ty==='area')c=`<textarea data-f="${k}" rows="3">${e(v)}</textarea>`;
 else c=`<input data-f="${k}" type="${ty}" value="${e(v)}">`+(ty==='url'&&safeUrl(v)?`<a class="lk" href="${e(v)}" target="_blank" rel="noopener">Open link</a>`:'');
 return `<label class="${ty==='area'?'w':''}"><span>${l}</span>${c}</label>`}
function pubs(r){const o=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
 return `<div class="w"><span class="lb">Publishers (a proposal can go to several)</span>${(r.pubs||[]).map((p,i)=>`<div class="pr"><input data-pi="${i}" data-pf="n" placeholder="Publisher" aria-label="Publisher" value="${e(p.n)}"><select data-pi="${i}" data-pf="s" aria-label="Proposal status">${o(S_PUB,p.s)}</select><select data-pi="${i}" data-pf="a" aria-label="Acknowledgement"><option value="">Acknowledgement</option>${o(['Pending','Received'],p.a)}</select><input data-pi="${i}" data-pf="d" type="date" aria-label="Date" value="${e(p.d)}"><input data-pi="${i}" data-pf="x" placeholder="Note" aria-label="Note" value="${e(p.x)}"><button class="ic" data-act="rmpub" data-i="${i}" aria-label="Remove publisher">×</button></div>`).join('')}<button class="btn2" data-act="addpub">${ic('plus')} Add publisher</button></div>`}
function card(t,r){const sc=SCHEMA[t],o=open.has(r.id),h=D.act.filter(a=>a.id===r.id).slice(0,4);
 return `<article class="card rec" id="${r.id}" data-t="${t}" data-id="${r.id}"><div class="rh"><div><input class="tt" data-f="title" value="${e(r.title)}" aria-label="Title"><small>${e(sc.meta(r))}</small></div>${badge(r[sc.st])}<button class="ic" data-act="toggle" aria-expanded="${o}" aria-label="${o?'Collapse':'Expand'}">${ic('chev')}</button></div>
 ${o?`<div class="fg">${sc.f.map(f=>ctl(f,r)).join('')}${t==='books'?pubs(r):''}
 ${t==='projects'?linked(r):''}${chk(r.todo||[],r.id)}
 ${h.length?`<div class="w"><span class="lb">Status history</span><ul class="hist">${h.map(a=>`<li>${fmt(a.d)}: ${e(a.t)}</li>`).join('')}</ul></div>`:''}</div>
 <div class="acts"><button class="btn" data-act="savecard">Save changes</button><button class="btn2" data-act="archive">Archive</button><button class="btn2" data-act="del">Delete</button></div>`:''}</article>`}
function linked(p){const L=[];for(const t of['patents','conferences','journals'])A(t).filter(r=>r.project===p.id).forEach(r=>L.push([t,r]));
 return `<div class="w"><span class="lb">Linked patents, papers and journals</span>${L.map(([t,r])=>row(t,r)).join('')||'<small>None yet. Pick this project in a record to link it.</small>'}</div>`}
function list(t){const q=flt.q.toLowerCase(),sc=SCHEMA[t];
 const L=A(t).filter(r=>(!flt.s||r[sc.st]===flt.s)&&(!q||vals(r).includes(q)));
 return L.map(r=>card(t,r)).join('')||'<p class="mu">No records match. Use the add button to create one.</p>'}
const vals=r=>Object.values(r).map(v=>typeof v==='object'?JSON.stringify(v):v).join(' ').toLowerCase();
function section(t){const sc=SCHEMA[t];
 return head(sc.nav,`<button class="btn" data-act="add" data-t="${t}">${ic('plus')} Add ${sc.one}</button>`)+
 `<div class="bar"><input id="fq" placeholder="Filter ${sc.nav.toLowerCase()}" aria-label="Filter" value="${e(flt.q)}"><select id="fs" aria-label="Status filter"><option value="">All statuses</option>${sc.statuses.map(s=>`<option${s===flt.s?' selected':''}>${s}</option>`).join('')}</select></div><div id="list">${list(t)}</div>
 <section class="card" data-sec="${t}"><h2>${sc.nav} checklist</h2><div class="fg" style="margin-top:0">${chk(D.sn[t]||[],'sec-'+t)}</div></section>`}
function timeline(){const up=deadlines().filter(x=>days(x.d)>=0),g={};up.forEach(x=>(g[x.d.slice(0,7)]=g[x.d.slice(0,7)]||[]).push(x));
 return head('Timeline')+`<div class="two"><section class="card"><h2>History</h2>${D.act.slice(0,80).map(a=>`<div class="row"><span>${e(a.t)}</span><small>${fmt(a.d)}</small></div>`).join('')||'<p class="mu">No history yet.</p>'}</section>
 <section class="card"><h2>Upcoming</h2>${Object.keys(g).map(m=>`<span class="lb">${fmt(m)}</span>${g[m].map(x=>`<button class="row" data-act="go" data-t="${x.ty}" data-id="${x.id}"><span><b>${e(x.t)}</b></span><small>${fmt(x.d)}</small></button>`).join('')}`).join('')||'<p class="mu">No upcoming dates.</p>'}</section></div>`}
function archive(){const Ar=[],N=[];for(const t in SCHEMA)D.records[t].forEach(r=>{if(r.archived)Ar.push([t,r]);else if((r.todo||[]).length)N.push([t,r])});
 return head('Notes & Archive')+`<section class="card"><h2>Archive</h2>${Ar.map(([t,r])=>`<div class="row rec" data-t="${t}" data-id="${r.id}"><span><b>${e(r.title)}</b><small>${SCHEMA[t].one}</small></span><span class="acts" style="margin:0"><button class="btn2" data-act="restore">Restore</button><button class="btn2" data-act="del">Delete</button></span></div>`).join('')||'<p class="mu">Completed or discontinued work you archive appears here.</p>'}</section>
 <section class="card"><h2>All checklists</h2>${Object.keys(SCHEMA).filter(t=>(D.sn[t]||[]).length).map(t=>`<div class="row"><span><b>${SCHEMA[t].nav} checklist</b><pre>${e(fmtL(D.sn[t]))}</pre></span></div>`).join('')}${N.map(([t,r])=>`<button class="row" data-act="go" data-t="${t}" data-id="${r.id}"><span><b>${e(r.title)}</b><pre>${e(fmtL(r.todo))}</pre></span></button>`).join('')||'<p class="mu">No checklists yet.</p>'}</section>`}
function search(){const q=gq.toLowerCase(),o=[];for(const t in SCHEMA)D.records[t].forEach(r=>vals(r).includes(q)&&o.push(row(t,r)));
 return head('Search results')+(o.length?`<section class="card">${o.join('')}</section>`:'<p class="mu">No matches.</p>')}
function render(){view=location.hash.slice(1)||'dashboard';
 $('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===view?'on':''}">${ic(n[2])}${n[1]}</a>`).join('');
 $('#view').innerHTML=view==='search'?search():view==='dashboard'?dash():view==='timeline'?timeline():view==='archive'?archive():SCHEMA[view]?section(view):dash()}
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
function add(t){const r={id:t[0]+Date.now().toString(36),title:'Untitled',u:now()};if(t==='books')r.pubs=[];D.records[t].unshift(r);open.add(r.id);act(`Added ${SCHEMA[t].one}`,r.id);save();
 if(view===t)keep();else location.hash=t}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- events ---------- */
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.tagName==='SELECT')return;
 if(t.id==='fq'){flt.q=t.value;$('#list').innerHTML=list(view);return}
 if(t.id==='gs'){gq=t.value;if(!gq){if(view==='search')location.hash='dashboard'}else if(view!=='search')location.hash='search';else render();return}
 if(t.dataset.ct!==undefined){lst(t)[+t.dataset.ct].t=t.value;touch(t);return saveSoon()}
 const rc=t.closest('.rec');if(!rc)return;const r=find(rc.dataset.t,rc.dataset.id);
 if(t.dataset.pi!==undefined)r.pubs[+t.dataset.pi][t.dataset.pf]=t.value;else if(t.dataset.f)r[t.dataset.f]=t.value;else return;
 r.u=now();saveSoon()});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='imp'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.records||!Object.keys(SCHEMA).every(k=>Array.isArray(x.records[k])))throw 0;if(!confirm('Replace everything in this browser with the imported backup?'))return;D=fix(x);save();render()}catch(_){alert('That file is not a valid portfolio backup.')}};rd.readAsText(f);t.value='';return}
 if(t.id==='fs'){flt.s=t.value;$('#list').innerHTML=list(view);return}
 if(t.dataset.ci!==undefined){const L=lst(t),it=L[+t.dataset.ci];it.d=t.checked;touch(t);const c=t.closest('.rec');if(c&&it.d){const r0=find(c.dataset.t,c.dataset.id);act(`${r0.title}: done, ${it.t}`,r0.id)}save();keep();return}
 if(t.tagName!=='SELECT')return;const rc=t.closest('.rec');if(!rc)return;
 const ty=rc.dataset.t,r=find(ty,rc.dataset.id);
 if(t.dataset.pi!==undefined)r.pubs[+t.dataset.pi][t.dataset.pf]=t.value;
 else{const k=t.dataset.f,fd=SCHEMA[ty].f.find(x=>x[0]===k),old=r[k]||'';r[k]=t.value;if(fd&&fd[2]==='sel')act(`${r.title}: ${fd[1]} ${old||'not set'} to ${t.value||'not set'}`,r.id)}
 r.u=now();save();keep()});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,rc=b.closest('.rec'),t=rc&&rc.dataset.t,r=rc&&find(t,rc.dataset.id);
 if(a==='toggle'){open.has(r.id)?open.delete(r.id):open.add(r.id);keep()}
 else if(a==='add')add(b.dataset.t);
 else if(a==='savecard'){clearTimeout(tm);r.u=now();act(`${r.title}: changes saved`,r.id);save();keep();const nb=document.querySelector('#'+CSS.escape(r.id)+' [data-act=savecard]');if(nb){nb.textContent='Saved ✓';setTimeout(()=>{nb.textContent='Save changes'},1500)}}
 else if(a==='archive'||a==='restore'){r.archived=a==='archive';r.u=now();act(`${r.title}: ${a==='archive'?'archived':'restored'}`,r.id);save();keep()}
 else if(a==='del'){if(confirm('Delete this record permanently?')){D.records[t]=D.records[t].filter(x=>x!==r);save();keep()}}
 else if(a==='addpub'){(r.pubs=r.pubs||[]).push({n:'',s:'Submitted'});save();keep()}
 else if(a==='rmpub'){r.pubs.splice(+b.dataset.i,1);save();keep()}
 else if(a==='go'){const x=find(b.dataset.t,b.dataset.id),h=x&&x.archived?'archive':b.dataset.t;open.add(b.dataset.id);if(location.hash.slice(1)===h)render();else location.hash=h;setTimeout(()=>{const el=document.getElementById(b.dataset.id);el&&el.scrollIntoView({block:'center'})},60)}
 else if(a==='cadd')addItem(b.parentElement.querySelector('[data-cn]'));
 else if(a==='cdel'){lst(b).splice(+b.dataset.i,1);touch(b);save();keep()}
 else if(a==='export')download(`research-portfolio-backup-${today()}.json`,JSON.stringify(D,null,2),'application/json');
 else if(a==='import')$('#imp').click();
 else if(a==='notes'){let s='# Research portfolio checklists\n\n';for(const k in SCHEMA){if((D.sn[k]||[]).length)s+=`## ${SCHEMA[k].nav} (section checklist)\n${fmtL(D.sn[k])}\n\n`;D.records[k].filter(r=>(r.todo||[]).length).forEach(r=>s+=`## ${r.title} (${SCHEMA[k].one})\n${fmtL(r.todo)}\n\n`)}download(`research-checklists-${today()}.md`,s,'text/markdown')}
 else if(a==='theme'){D.prefs.theme=D.prefs.theme==='dark'?'light':'dark';theme();save()}
 else if(a==='menu')document.body.classList.toggle('nav-open')});
document.addEventListener('keydown',ev=>{const t=ev.target;if(ev.key==='Enter'&&t.dataset&&t.dataset.cn!==undefined){ev.preventDefault();addItem(t)}});
addEventListener('hashchange',()=>{flt={q:'',s:''};if(location.hash!=='#search'){gq='';$('#gs').value=''}document.body.classList.remove('nav-open');render();scrollTo(0,0)});
function theme(){document.documentElement.dataset.theme=D.prefs.theme;document.querySelector('[data-act=theme]').innerHTML=ic('sun')+(D.prefs.theme==='dark'?'Light mode':'Dark mode')}

/* ---------- init ---------- */
D=load();
$('#logo').innerHTML=ic('book');$('#si').innerHTML=ic('search');$('#mb').innerHTML=ic('menu');
document.querySelector('[data-act=export]').innerHTML=ic('down')+'Export backup (JSON)';
document.querySelector('[data-act=import]').innerHTML=ic('up')+'Import backup (JSON)';
document.querySelector('[data-act=notes]').innerHTML=ic('file')+'Download checklists';
theme();stamp();render();
try{if(!localStorage.getItem(KEY)||!JSON.parse(localStorage.getItem(KEY)).p3)save()}catch(_){$('#warn').style.display='block'}
</script>
</body>
</html>
